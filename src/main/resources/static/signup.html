<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>회원가입 - 배터리 주문 관리</title>
	<link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-page">
<main class="login-box">
	<h1>회원가입</h1>
	<p class="muted">가입 코드를 아는 사람만 가입할 수 있습니다.</p>
	<div id="alerts"></div>
	<form id="signupForm" class="stack">
		<label>아이디 <input type="text" name="username" autocomplete="username" minlength="4" maxlength="20" autofocus required></label>
		<p class="muted hint">4~20자, 영문 소문자·숫자·밑줄(_)</p>
		<label>비밀번호 <input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="50" required></label>
		<p class="muted hint">8자 이상</p>
		<label>비밀번호 확인 <input type="password" name="passwordConfirm" autocomplete="new-password" required></label>
		<label>가입 코드 <input type="password" name="code" autocomplete="off" required></label>
		<button type="submit" class="primary">가입</button>
	</form>
	<p class="muted">이미 계정이 있나요? <a href="/login">로그인</a></p>
</main>
<script src="/js/common.js"></script>
<script src="/js/signup.js"></script>
</body>
</html>
