spring.application.name=demo
spring.datasource.url=jdbc:h2:file:./data/battery;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# 오류 응답에 서버 내부 정보(스택 트레이스, 예외 메시지)를 싣지 않는다.
# spring-boot-devtools 로 실행하면 이 값들의 기본값이 always 로 바뀌어 깨진 요청의 오류 응답에 trace 가 실렸다.
# (Spring Boot 4 에서는 이름이 spring.web.error.* 이다. server.error.* 로 쓰면 적용되지 않는다.)
# 업무 오류(BusinessException)의 메시지는 ApiExceptionHandler 가 따로 응답하므로 영향이 없다.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
