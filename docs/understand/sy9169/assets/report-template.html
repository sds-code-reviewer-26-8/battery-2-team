<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{제목: 2~4단어 이름}}</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --text:#1c2430; --muted:#5b6675; --line:#dfe3e9;
  --accent:#1f6feb; --accent-soft:#e6f0ff; --ok:#1a7f4b; --ok-soft:#e3f5ea;
  --warn:#9a5b00; --warn-soft:#fff2d9; --bad:#b42318; --bad-soft:#fde8e6;
  --code:#f0f2f5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141a; --surface:#181e27; --text:#e6eaf0; --muted:#9aa5b5; --line:#2b3340;
    --accent:#6aa6ff; --accent-soft:#1b2a44; --ok:#56d28d; --ok-soft:#14301f;
    --warn:#f2b44d; --warn-soft:#33270f; --bad:#ff8a80; --bad-soft:#3a1a18; --code:#222a35;
  }
}
:root[data-theme="dark"]{
  --bg:#10141a; --surface:#181e27; --text:#e6eaf0; --muted:#9aa5b5; --line:#2b3340;
  --accent:#6aa6ff; --accent-soft:#1b2a44; --ok:#56d28d; --ok-soft:#14301f;
  --warn:#f2b44d; --warn-soft:#33270f; --bad:#ff8a80; --bad-soft:#3a1a18; --code:#222a35;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.7 -apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:28px 16px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top .wrap{padding:0}
h1{margin:0 0 6px;font-size:1.7rem}
h2{margin:0 0 12px;font-size:1.3rem}
h3{margin:20px 0 8px;font-size:1.05rem}
p{margin:8px 0}
.sub{color:var(--muted);margin:0}
nav.toc{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.toc .wrap{display:flex;gap:4px;overflow-x:auto;padding:8px 16px}
nav.toc a{white-space:nowrap;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:999px;font-size:.9rem}
nav.toc a:hover{background:var(--accent-soft);color:var(--accent)}
section{padding:28px 0 8px;scroll-margin-top:52px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:12px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.step .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;
  background:var(--accent);color:#fff;font-weight:700;font-size:.9rem;margin-bottom:6px}
.step b{display:block;margin-bottom:4px}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.8rem;font-weight:600;margin-right:4px}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--accent-soft);color:var(--accent)}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.85rem}
code{background:var(--code);padding:1px 6px;border-radius:5px;font:0.88em ui-monospace,Consolas,monospace}
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout.ok{border-color:var(--ok);background:var(--ok-soft)}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin:8px 0}
summary{cursor:pointer;font-weight:600}
svg{max-width:100%;height:auto;display:block;margin:8px auto}
svg text{fill:var(--text);font:13px -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
svg .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
svg .hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
svg .okb{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.5}
svg .badb{fill:var(--bad-soft);stroke:var(--bad);stroke-width:1.5}
svg .arrow{stroke:var(--muted);stroke-width:1.6;fill:none}
svg .sm{font-size:11.5px;fill:var(--muted)}
ul.check{list-style:none;padding:0;margin:8px 0}
ul.check li{padding:6px 0 6px 28px;position:relative;border-bottom:1px dashed var(--line)}
ul.check li::before{content:"☐";position:absolute;left:4px;color:var(--accent)}
.themebtn{float:right;border:1px solid var(--line);background:var(--surface);color:var(--text);
  border-radius:8px;padding:4px 10px;cursor:pointer}
footer{padding:28px 0 60px;color:var(--muted);font-size:.9rem}
@media (max-width:560px){ h1{font-size:1.4rem} .card{padding:14px} }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <button class="themebtn" id="themebtn" type="button">테마 전환</button>
    <h1>{{제목}}</h1>
    <p class="sub">{{한 줄 부제: 누구를 위한 자료인지}}</p>
  </div>
</header>

<nav class="toc"><div class="wrap">
  <!-- 섹션마다 한 줄: <a href="#id">번호 이름</a> -->
  <a href="#what">1 무엇을 하는 코드</a>
</div></nav>


<main class="wrap">

<!--
  섹션 패턴 (필요한 것만 남기고, 없는 정보로 채우지 말 것)
  <section id="what"><h2>1. ...</h2> ... </section>

  쓸 수 있는 부품: .card  .grid > .step(.n)  table  .callout(.warn/.ok)  details>summary
                  .tag(.ok/.warn/.bad/.info)  ul.check  인라인 <svg>(.box .hl .okb .badb .arrow .sm)
-->

<section id="what">
  <h2>1. 무엇을 하는 코드인가</h2>
  <div class="card"><p>{{한두 문단: 업무/목적 중심, 개발 용어 최소화}}</p></div>
</section>

</main>

<footer><div class="wrap">
  {{기준 커밋/분석 범위 한 줄. 코드가 바뀌면 내용도 달라질 수 있음을 명시}}
</div></footer>

<script>
(function(){
  var btn=document.getElementById('themebtn');
  var root=document.documentElement;
  try{var saved=localStorage.getItem('theme'); if(saved) root.setAttribute('data-theme',saved);}catch(e){}
  btn.addEventListener('click',function(){
    var dark=window.matchMedia('(prefers-color-scheme: dark)').matches;
    var cur=root.getAttribute('data-theme')||(dark?'dark':'light');
    var next=cur==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem('theme',next);}catch(e){}
  });
})();
</script>
</body>
</html>
