<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- SECTION: title --></title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f6f7f9;
    --border: #d9dde3;
    --text: #1f2328;
    --muted: #59636e;
    --accent: #0b5cad;
    --accent-soft: #e3eefb;
    --code-bg: #eef1f4;
    --radius: 8px;
    --maxw: 960px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1419;
      --surface: #171d24;
      --border: #2b343e;
      --text: #e6edf3;
      --muted: #9aa6b2;
      --accent: #6cb4ff;
      --accent-soft: #15283d;
      --code-bg: #1e262f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1419;
    --surface: #171d24;
    --border: #2b343e;
    --text: #e6edf3;
    --muted: #9aa6b2;
    --accent: #6cb4ff;
    --accent-soft: #15283d;
    --code-bg: #1e262f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.65;
    overflow-x: hidden;
  }
  main { max-width: var(--maxw); margin: 0 auto; padding: 32px 16px 64px; }
  header.hero { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 24px; }
  header.hero h1 { font-size: 1.9rem; margin: 0 0 6px; }
  header.hero p.lead { color: var(--muted); margin: 0 0 12px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-size: 0.8rem; font-weight: 600;
  }
  nav.toc { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 28px; }
  nav.toc ol { margin: 0; padding-left: 20px; columns: 2; column-gap: 24px; }
  nav.toc a { color: var(--accent); text-decoration: none; }
  nav.toc a:hover { text-decoration: underline; }
  section { margin-bottom: 40px; }
  h2 { font-size: 1.35rem; border-left: 4px solid var(--accent); padding-left: 10px; margin: 0 0 14px; }
  h3 { font-size: 1.05rem; margin: 18px 0 8px; }
  p { margin: 0 0 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .card h3 { margin: 0 0 6px; }
  .card p { color: var(--muted); font-size: 0.92rem; margin: 0 0 6px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; min-width: 480px; font-size: 0.92rem; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  th { background: var(--surface); font-weight: 600; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 0.88em; font-family: Consolas, "D2Coding", monospace; }
  pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; overflow-x: auto; }
  pre code { background: none; padding: 0; font-size: 0.88rem; }
  ul.rules { padding-left: 20px; }
  ul.rules li { margin-bottom: 6px; }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
  .flow .state { padding: 6px 14px; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .flow .sep { color: var(--muted); }
  .tree { font-family: Consolas, "D2Coding", monospace; font-size: 0.88rem; white-space: pre; }
  footer { color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--border); padding-top: 14px; }
  @media (max-width: 600px) {
    nav.toc ol { columns: 1; }
    header.hero h1 { font-size: 1.5rem; }
  }
</style>
</head>
