<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구현 사전 점검</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1b2330; --muted:#657084; --line:#e1e6ef; --accent:#4f46e5; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.65 "Malgun Gothic", system-ui, sans-serif; }
  .wrap { max-width:980px; margin:0 auto; padding:24px 16px; }
  .hero { background:linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff; padding:24px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; }
  h2 { margin:0 0 12px; font-size:1.05rem; }
  .muted { color:var(--muted); } .small { font-size:.85rem; }
  .tc { border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:10px; }
  .plan { white-space:pre-wrap; background:var(--bg); border-radius:12px; padding:14px; font-size:.9rem; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:.78rem; font-weight:700; background:#eceafe; color:var(--accent); }
</style>
</head>
<body>
<div class="hero"><div class="wrap" style="padding:0"><b>READY</b><h1 id="title"></h1><div id="sub"></div></div></div>
<main class="wrap">
  <section class="card"><h2>배경 이해</h2><div id="bg"></div></section>
  <section class="card"><h2>목적 이해</h2><div id="pu"></div></section>
  <section class="card"><h2>변경 규모와 위험</h2><div id="risk"></div></section>
  <section class="card"><h2>테스트 점검</h2><div id="tcs"></div></section>
  <section class="card"><h2>구현 후 꼭 확인할 3가지</h2><div id="checks"></div></section>
  <section class="card"><h2>구현 계획</h2><div class="plan" id="plan"></div></section>
</main>
<script id="data" type="application/json">{"request":"PR #31 리뷰 반영: 고객사를 필수 입력으로 변경 (확정 시·확정 후 수정 시 빈 값 거절, 기존 null 주문 처리)","round":1,"status":"READY","reason":"","questions":[],"background":{"understood":true,"summary":"브랜치 feature-add-function-no-1 에 확정 시 고객사 입력과 확정 후 수정 기능이 이미 있고 현재는 선택 입력이다(빈 값은 null 로 저장). PR 리뷰 결정에 따라 필수로 바꾼다.","evidence":["OrderService.normalizeCustomer: 공백만이면 null 반환(OrderService.java:148-154)","order-new.html:44 '고객사 (선택)', order-detail.js:31-37 수정 폼은 빈 값도 전송","PRD.md F4 [미구현] 고객사·납기 서술(PRD.md:52)"]},"purpose":{"understood":true,"summary":"고객사 없는 주문이 새로 생기지 않게 한다. 서버가 최종 방어선이고 화면은 안내한다. 이미 저장된 null 주문은 바꾸지 않고 '-' 로 두되, 처음 채우는 것은 허용하고 채운 뒤에는 지울 수 없게 한다.","evidence":["요청문 규칙 1~5(사람이 확정)","INTENT.md:81 새 항목은 기존 주문에 영향을 주지 않아야 한다(G1)"]},"risk":{"size":"medium","severity":"medium","userAware":true,"warning":"확정 API 의 입력 검증이 엄격해지므로, 고객사 없이 확정하는 기존 JUnit·E2E 호출이 모두 400 으로 깨진다. 공용 helpers.ts 수정은 다른 스펙 전체에 영향을 준다. 이유를 report 에 남겨야 한다.","items":[{"title":"기존 테스트·E2E 대량 파손","detail":"ServiceBehaviorTest, WebBehaviorTest(confirm 헬퍼 외 직접 POST), OrderFlowTests, E2E 의 helpers.createOrder, master-change-confirm-conflict, order-status-flow, robustness, team-ctkim1005 의 #confirmBtn 및 POST /api/orders 호출을 빠짐없이 고쳐야 한다.","severity":"medium"},{"title":"기존 null 주문 규칙","detail":"null 주문은 '-' 표시, 수정 폼에서 처음 채우기만 허용, 채운 뒤 지우기 불가. 빈 값 저장은 null 주문에서도 거절한다. 엔티티·스키마는 바꾸지 않는다(파일 DB 호환).","severity":"medium"},{"title":"불변 규칙 유지","detail":"완료·취소 수정 불가, 낙관적 락 version, 상태 이력 미기록, planJson·비용 불변, 100자 제한은 건드리지 않는다. 검증 순서(version 충돌, 상태 잠금, 그다음 값 검증)는 기존 메시지를 바꾸지 않게 주의한다.","severity":"medium"},{"title":"E2E 실행 확인 한계","detail":"E2E 는 이 단계에서 실행하지 못했다(확인하지 못함). 기존 null 주문을 E2E 로 만들 수 없어 서버 레벨 JUnit 으로 검증한다.","severity":"low"}]},"testCases":[{"id":"TC-1","origin":"existing","kind":"regression","target":"ServiceBehaviorTest 고객사 테스트(confirmStoresTrimmedCustomerName 등)","description":"앞뒤 공백 제거 저장, 100자 허용·101자 거절, 완료·취소 수정 불가, 낡은 version 충돌은 그대로","input":"기존 입력(확정 호출은 고객사 포함으로 수정)","expected":"기존 기대값 유지"},{"title":"","id":"TC-2","origin":"new","kind":"boundary","target":"OrderService.confirm","description":"고객사 null, 빈 문자열, 공백뿐이면 확정 거절","input":"customerName = null, '', '   ', '\\t'","expected":"BusinessException '고객사를 입력하세요' 류 메시지, 주문 저장 0건, 이력 0건"},{"id":"TC-3","origin":"new","kind":"boundary","target":"OrderService.confirm","description":"길이 경계","input":"'가'x1, 'x'x100, 'x'x101, 앞뒤 공백 포함 100자","expected":"1자·100자(공백 제거 후) 성공, 101자 BusinessException '고객사는 100자 이하로 입력하세요'"},{"id":"TC-4","origin":"new","kind":"boundary","target":"OrderService.changeCustomerName","description":"수정 시 빈 값 거절","input":"고객사 '원래' 주문에 '', '   ', null 로 수정","expected":"BusinessException, 고객사 '원래' 유지, version 증가 없음"},{"id":"TC-5","origin":"new","kind":"feature","target":"OrderService.changeCustomerName / 상세 API","description":"기존 null 주문: 상세 표시와 처음 채우기","input":"repository 로 customerName null 주문 직접 저장 후 GET /api/orders/{id}, 수정 '신규사', 이어서 '' 로 수정","expected":"상세 customerName 이 null(화면은 '-')이고 customerEditable true. '신규사' 저장 성공, 이후 '' 수정은 거절되고 '신규사' 유지. planJson·비용·이력 건수 불변"},{"id":"TC-6","origin":"new","kind":"regression","target":"WebBehaviorTest / OrderFlowTests POST /api/orders","description":"고객사 없는 확정 요청은 400 과 이유 응답","input":"customerName 키 없음, null, '  ' 로 POST","expected":"HTTP 400, $.error 에 이유, 주문 건수 증가 없음. 고객사 있는 요청은 200"},{"id":"TC-7","origin":"new","kind":"regression","target":"WebBehaviorTest POST /api/orders/{id}/customer","description":"수정 API 빈 값 400, 완료·취소는 기존 메시지","input":"빈 값 수정, 완료·취소 주문 수정","expected":"빈 값은 400 과 이유, 완료·취소는 기존 '상태의 주문은 고객사를 수정할 수 없습니다' 메시지, 로그인 없으면 401"},{"id":"TC-8","origin":"new","kind":"regression","target":"E2E order-customer.spec.ts C1","description":"입력하지 않으면 확정이 거절됨(화면)","input":"시뮬레이션 후 고객사 비움 또는 공백, 확정 버튼","expected":"확정 버튼 비활성과 안내 문구, 입력칸 필수 표시(required), 주문 건수 불변. 입력하면 활성"},{"id":"TC-9","origin":"new","kind":"regression","target":"E2E order-customer.spec.ts C2~C4, 공용 helpers.createOrder","description":"기존 시나리오가 고객사 입력으로 계속 통과, 수정 화면 빈 값은 저장 버튼 막힘","input":"createOrder 가 고객사를 채움. 수정 입력칸을 비우거나 공백으로 만듦","expected":"저장 버튼 비활성과 안내, 기존 C2~C4 통과(C2 의 빈 값 저장 단계는 거절 확인으로 교체)"},{"id":"TC-10","origin":"existing","kind":"regression","target":"PlannerTest, DemoApplicationTests, OrderFlowTests 상태 전이","description":"경로 계산·컨텍스트·상태 전이 회귀","input":"./gradlew test","expected":"전부 통과"}],"checklist":[{"title":"서버가 빈 고객사를 확정·수정 모두에서 거절하고 기존 규칙은 유지","detail":"./gradlew test 통과. TC-2,3,4,6,7 이 포함되어 있는지 테스트 파일에서 Grep 으로 확인. 100자 경계, 완료·취소 수정 불가 메시지, 낡은 version 충돌 테스트가 그대로 통과"},{"title":"기존 null 주문은 '-' 표시와 처음 채우기만 허용되고 확정 내용은 불변","detail":"TC-5 가 JUnit 에서 통과. 처음 채운 뒤 빈 값 수정이 거절되고, planJson·totalCost·history 건수가 변하지 않음을 단언. Order 엔티티 컬럼과 스키마 diff 가 없음을 git diff 로 확인"},{"title":"모든 확정 호출(JUnit, E2E, 화면 JS)이 고객사를 포함하고 문서가 반영됨","detail":"Grep 으로 src/test 의 orderService.confirm, POST /api/orders, #confirmBtn 호출부에 고객사가 있는지 확인. order-new.js·order-detail.js 의 버튼 막기 로직, order-new.html '(선택)' 문구 제거, PRD.md F4 에 '필수' 반영을 파일 내용으로 확인. E2E 공용 변경 이유가 report 에 있음"}],"plan":"1. OrderService: normalizeCustomer 를 필수 검증으로 바꾼다. strip 후 null 또는 빈 값이면 BusinessException(예: '고객사를 입력하세요'), 100자 초과는 기존 메시지 유지. confirm 과 changeCustomerName 이 같은 메서드를 쓴다. changeCustomerName 의 검증 순서는 version, 상태 잠금, 값 검증으로 둔다. 기존 null 주문은 빈 값이 아닌 값으로만 채워지므로 별도 분기가 필요 없다. 엔티티·스키마·OrderDetail DTO 는 변경하지 않는다. Order.java 의 '선택' 주석만 필수 설명으로 고친다.\n2. OrderApiController: BusinessException 이 400 으로 매핑되는지 확인한다(기존 100자 초과가 400 인지 확인하지 못함, 구현 시 확인). 아니면 기존 처리를 따른다.\n3. order-new.html/order-new.js: 라벨에서 '(선택)' 제거, 입력칸에 required 와 필수 표시, 확정 버튼은 trim 한 값이 비면 disabled 와 안내 문구, input 이벤트로 갱신. 시뮬레이션 전 숨김 규칙(simulation-result-visibility)과 충돌하지 않게 한다.\n4. order-detail.js: 수정 폼 입력칸 required, trim 이 비면 저장 버튼 disabled 와 안내. 기존 null 주문은 '-' 표시 유지, 입력칸은 빈 상태로 시작해 채우면 저장 가능.\n5. JUnit: ServiceBehaviorTest(confirm 헬퍼와 직접 호출에 고객사 추가, blankCustomerNameBecomesNull 을 거절 테스트로 교체, TC-2,3,4,5 추가), WebBehaviorTest(confirm 헬퍼와 직접 POST 에 고객사 추가, confirmRequestWithoutCustomerNameStillWorks 를 400 테스트로 교체, TC-6,7 추가), OrderFlowTests(confirm 의 JSON 에 customerName 추가, TC-6 일부). null 주문은 repository 로 직접 저장해 만든다.\n6. E2E: helpers.createOrder 에 고객사 입력 추가(공용 수정 이유를 report 에 기록: 필수화로 기존 헬퍼가 확정 불가). master-change-confirm-conflict, order-status-flow, robustness, team-ctkim1005 의 #confirmBtn 과 POST /api/orders 호출에 고객사 추가. order-customer.spec.ts: C1 을 '입력하지 않으면 확정 거절', C2 의 빈 값 저장을 거절 확인으로 교체, C4 의 null 생성을 고객사 있는 주문으로 교체, 기존 주문 '-' 표시와 처음 채우기는 E2E 에서 빼고 JUnit(TC-5)에서 검증한다고 주석으로 남긴다.\n7. docs/PRD-INTENT/team/PRD.md: F4 와 표(144행) 등 고객사 서술에 '필수' 반영. INTENT.md 는 요청 범위 밖이라 바꾸지 않는다.\n8. ./gradlew test 를 실행한다. E2E 는 실행 환경이 있으면 실행한다.\n\n범위 밖: 납기, 마이그레이션, 기존 null 데이터 일괄 채우기, PR 의견 작성(2번 결정은 사람이 PR 에 남김).\n\n사람이 직접 확인할 것: 확정·수정 화면에서 버튼 비활성, 필수 표시, 안내 문구의 실제 모양."}</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById('data').textContent);
  var $=function(i){return document.getElementById(i)};
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  $('title').textContent=D.request;$('sub').textContent=D.round+'회차';
  [['bg',D.background],['pu',D.purpose]].forEach(function(p){var r=$(p[0]);r.appendChild(el('p','',p[1].summary));var u=el('ul','muted small');p[1].evidence.forEach(function(x){u.appendChild(el('li','',x))});r.appendChild(u)});
  var R=D.risk,rr=$('risk');rr.appendChild(el('span','pill','규모 '+R.size+' / 위험 '+R.severity));rr.appendChild(el('p','',R.warning));
  R.items.forEach(function(x){var b=el('div','tc');b.appendChild(el('b','',x.title+' ('+x.severity+')'));b.appendChild(el('div','small muted',x.detail));rr.appendChild(b)});
  D.testCases.forEach(function(t){var c=el('div','tc');c.appendChild(el('span','pill',t.origin+' / '+t.kind+' / '+t.id));c.appendChild(el('div','',t.description));c.appendChild(el('div','small muted','대상: '+t.target));c.appendChild(el('div','small muted','입력: '+t.input));c.appendChild(el('div','small muted','기대: '+t.expected));$('tcs').appendChild(c)});
  D.checklist.forEach(function(x,i){var b=el('div','tc');b.appendChild(el('b','',(i+1)+'. '+x.title));b.appendChild(el('div','small muted',x.detail));$('checks').appendChild(b)});
  $('plan').textContent=D.plan;
})();
</script>
</body>
</html>
