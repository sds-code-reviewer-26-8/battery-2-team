<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구현 사전 점검</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #1b2330; --muted: #657084; --line: #e1e6ef;
    --accent: #4f46e5; --accent-soft: #eceafe;
    --ok: #15803d; --ok-soft: #e1f6e8; --warn: #b45309; --warn-soft: #fdf0d9;
    --bad: #b91c1c; --bad-soft: #fde4e4; --info: #0369a1; --info-soft: #e0f2fe;
    --shadow: 0 1px 2px rgba(20,30,60,.06), 0 8px 24px rgba(20,30,60,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f131a; --card: #181d27; --text: #e8ecf3; --muted: #97a3b6; --line: #2a3241;
      --accent: #8b9cff; --accent-soft: #232a4a;
      --ok: #5ccf86; --ok-soft: #14301f; --warn: #f0b35a; --warn-soft: #33260f;
      --bad: #ff8b8b; --bad-soft: #3a1717; --info: #6cc4f2; --info-soft: #11293a;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.65 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  .hero { background: linear-gradient(135deg, var(--accent), #7c3aed); color: #fff; padding: 28px 16px 64px; }
  .hero.hilp { background: linear-gradient(135deg, #d97706, #dc2626); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
  .hero .wrap { padding: 0; }
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 4px 14px; border-radius: 999px;
    background: rgba(255,255,255,.2); font-weight: 700; letter-spacing: .04em; font-size: .85rem; }
  .hero h1 { margin: 12px 0 6px; font-size: 1.55rem; line-height: 1.35; }
  .hero p { margin: 0; opacity: .9; }
  main.wrap { margin-top: -40px; padding-bottom: 56px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    margin-bottom: 16px; box-shadow: var(--shadow); }
  .card h2 { margin: 0 0 12px; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
  .muted { color: var(--muted); } .small { font-size: .85rem; }
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 16px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
  .tile b { display: block; font-size: 1.6rem; line-height: 1.2; }
  .tile span { color: var(--muted); font-size: .82rem; }
  .grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .grid2 .card { margin-bottom: 0; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.info { background: var(--info-soft); color: var(--info); }
  .pill.acc { background: var(--accent-soft); color: var(--accent); }
  ul.ev { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: .88rem; }
  .meter { display: flex; gap: 6px; margin: 8px 0 4px; }
  .meter i { flex: 1; height: 10px; border-radius: 6px; background: var(--line); }
  .meter i.on.low { background: var(--ok); } .meter i.on.medium { background: var(--warn); } .meter i.on.high { background: var(--bad); }
  .risk { border-left: 4px solid var(--line); padding: 8px 12px; margin-top: 10px; background: var(--bg); border-radius: 0 10px 10px 0; }
  .risk.low { border-color: var(--ok); } .risk.medium { border-color: var(--warn); } .risk.high { border-color: var(--bad); }
  .alert { border-radius: 12px; padding: 12px 14px; margin-top: 12px; background: var(--bad-soft); color: var(--bad); font-weight: 600; }
  .alert.warn { background: var(--warn-soft); color: var(--warn); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
    padding: 4px 14px; cursor: pointer; font: inherit; font-size: .85rem; }
  .chip[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  input[type=search] { flex: 1 1 160px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: inherit; font-size: .85rem; }
  .tc { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .tc header { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; }
  .tc code { font-size: .85rem; color: var(--muted); }
  .tc dl { margin: 8px 0 0; display: grid; grid-template-columns: 64px 1fr; gap: 2px 10px; font-size: .88rem; }
  .tc dt { color: var(--muted); } .tc dd { margin: 0; white-space: pre-wrap; }
  .check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .check:first-of-type { border-top: 0; }
  .check input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--accent); }
  .check b { display: block; } .check.done b { text-decoration: line-through; color: var(--muted); }
  .progress { height: 8px; border-radius: 6px; background: var(--line); overflow: hidden; margin: 6px 0 4px; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .25s; }
  .plan { white-space: pre-wrap; background: var(--bg); border-radius: 12px; padding: 14px; font-size: .9rem; }
  details summary { cursor: pointer; font-weight: 700; }
  ol.q { margin: 8px 0 0; padding-left: 20px; } ol.q li { margin-bottom: 6px; }
  .empty { color: var(--muted); padding: 12px 0; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding-bottom: 32px; }
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="wrap">
    <span class="badge" id="badge"></span>
    <h1 id="title"></h1>
    <p id="sub"></p>
  </div>
</div>
<main class="wrap">
  <div class="tiles" id="tiles"></div>
  <div id="hilpBox"></div>
  <div class="grid2">
    <section class="card"><h2>🧭 배경 이해</h2><div id="bg"></div></section>
    <section class="card"><h2>🎯 목적 이해</h2><div id="pu"></div></section>
  </div>
  <section class="card" style="margin-top:16px"><h2>⚠️ 변경 규모와 위험</h2><div id="risk"></div></section>
  <section class="card"><h2>🧪 테스트 점검</h2>
    <div class="chips" id="chips"></div>
    <div id="tcs"></div>
  </section>
  <section class="card"><h2>✅ 구현 후 꼭 확인할 3가지</h2>
    <div class="progress"><i id="bar"></i></div><div class="small muted" id="barTxt"></div>
    <div id="checks"></div>
  </section>
  <section class="card" id="planCard"><h2>🗺️ 구현 계획</h2><div class="plan" id="plan"></div></section>
</main>
<footer>impl-plan 사전 점검 · 이 페이지는 계획 단계의 점검 결과입니다</footer>

<!-- 에이전트는 아래 JSON 한 줄만 실제 데이터로 교체한다. 문자열 안의 '<' 는 \u003c 로 이스케이프한다. -->
<script id="data" type="application/json">{"request":"공장 운영비(기본 하루 10억)를 master 화면에서 공장별로 설정하고, Planner가 COST 안 선택 시 운영비를 반영하게 한다","round":3,"status":"READY","reason":"","questions":[],"background":{"understood":true,"summary":"PRD F12 '공장 운영비(국가별) 비용 반영'이 [미구현]이고 INTENT §7-3도 [미결]이었다. 현재 총 비용 = 생산원가 + 운항비이며 Planner.Candidate 는 (ships, totalDays, shipping) 만 가진다. 1라운드 HILP 에서 사람이 기간(주문 있는 공장만 0일차~총 소요일), 입력 단위(공장별 4칸, 기본 10억/일), COST 기준(총비용 기준), 문서 수정 허용, 기존 주문 0원 처리를 모두 결정했다.","evidence":["docs/PRD-INTENT/team/PRD.md §4 F12, §5-8, §5-10, §9, §10-3","docs/PRD-INTENT/team/INTENT.md G1, G6, §7-3","src/main/java/com/example/demo/simulation/Planner.java (Candidate, schedule, toPlan: COST 는 shipping 최소, 같으면 totalDays 짧은 쪽)","src/main/java/com/example/demo/simulation/Master.java (FactoryParam 에 운영비 없음), Plan.java, StoredPlan.java"]},"purpose":{"understood":true,"summary":"실제보다 작게 나오던 총 비용에 공장 운영비를 넣어, 배 운영 계획 비교가 현실에 가깝게 되도록 한다. 주문이 있는 공장은 0일차부터 마지막 배 귀환일까지 매일 운영비가 들므로, 빨리 끝내는 안이 유리해진다. COST 안은 총 비용(생산원가+운항비+운영비) 최소 기준으로 바뀌고 FAST/NEAR 는 선택 기준이 그대로다.","evidence":["docs/PRD-INTENT/team/INTENT.md §5 (빨리 끝낼수록 유리하다는 설명), §7-3","src/main/java/com/example/demo/service/MasterService.java (마스터 입력 검증, 원 단위 저장/억 단위 입력)","src/main/resources/static/js/master.js, planview.js, order-new.js, orders.html, order-detail.html, master.html"]},"risk":{"size":"large","severity":"medium","userAware":true,"warning":"기본값 10억/일은 선박비 1억/일의 10배라 COST 안이 FAST 와 같아지거나 기존과 다른 안이 될 수 있고, 모든 시뮬레이션 합계가 커진다. 골든 파일(planner.txt, simulate-default.json)과 PRD 숫자 예시가 바뀐다. 기존 확정 주문은 운영비 0원으로 보이며 재계산하지 않는다.","items":[{"title":"골든 테스트·숫자 예시 변경","detail":"PlannerGoldenTest 는 planner.txt 와 합계·선택된 안을 비교한다. 운영비 기본값 10억 적용 시 합계와 COST 선택이 바뀌므로 의도된 변경으로 GOLDEN_UPDATE=true 로 재생성하고 git diff 로 확인해야 한다. 테스트 기본 마스터는 운영비를 0으로 둘지 10억으로 둘지 정해 PlannerTest 기존 단언(합계=생산원가+운항비 등)과 충돌하지 않게 한다. PRD §5 숫자 예시도 함께 갱신한다(G6).","severity":"medium"},{"title":"기존 DB·기존 주문 호환(G1)","detail":"ddl-auto=update 로 Factory 에 운영비 컬럼을 not null 로 추가하면 기존 행 때문에 H2 에서 실패할 수 있다. 기본값 10억을 컬럼 기본값으로 지정하거나 null 허용 후 DataInitializer/로더에서 채운다. 주문에는 operatingCost 컬럼(기본 0)을 추가하고, planJson 으로 저장된 옛 Master/Plan JSON 에 운영비 필드가 없어도 읽혀야 한다(없으면 0). 옛 주문 합계는 그대로 둔다.","severity":"high"},{"title":"서버 재계산·버전 충돌 유지(G2, G3, G5)","detail":"운영비 마스터 값 변경도 masterVersion 을 올려, 변경 전 시뮬레이션으로는 확정이 409 로 막혀야 한다. 확정 시 서버가 Planner 로 다시 계산해 저장하고 화면과 같은 계산 결과를 써야 한다. 합계 = 생산원가+운항비+운영비가 화면·저장·목록에서 일치해야 한다.","severity":"medium"},{"title":"입력 검증과 메시지(G7)","detail":"운영비 입력 범위(0 이상 정수 원, 억 단위 입력)와 오류 메시지를 이유와 함께 알리고, 일부만 저장되지 않게 기존 일괄 검증 흐름에 합친다. 0 허용 여부와 상한을 기존 선박비 규칙과 맞춘다.","severity":"medium"},{"title":"COST 선택 기준 변경과 비김 규칙(G6)","detail":"COST 는 총비용 최소, 같으면 더 빠른 쪽으로 유지한다. FAST 는 totalDays 최소, 같으면 총비용(또는 기존대로 운항비)이 낮은 쪽이다. 비김 처리 기준을 명시해야 해서 FAST 의 보조 기준을 총비용으로 쓸지 기존 운항비로 둘지 구현 때 정하고 PRD §5-10 에 맞춘다. 이름도 '운항비 최소'에서 '총 비용 최소'류로 바꾸므로 라벨을 쓰는 JS·테스트·E2E 문구가 함께 바뀐다.","severity":"medium"},{"title":"팀 공용 문서 수정","detail":"docs/PRD-INTENT/* 수정은 사람이 허용했다(같은 PR). F12 [구현됨] 전환, §5-8·§5-10·숫자 예시·§9·§10-3, INTENT §5·§7-3 을 갱신한다. build.gradle.kts, helpers.ts 등 다른 공용 파일은 건드리지 않는다.","severity":"low"}]},"testCases":[{"id":"TC-1","origin":"existing","kind":"regression","target":"PlannerTest.everyOptionCollectsExactlyWhatWasOrdered / eachCountryIsVisitedByOneShipOnly / usesAtMostAvailableShips","description":"운영비를 넣어도 적재량 합, 나라당 한 척, 배 수 제한 불변식은 그대로여야 한다.","input":"기본 마스터, 여러 주문 조합","expected":"모두 통과"},{"id":"TC-2","origin":"existing","kind":"regression","target":"PlannerGoldenTest.resultsMatchTheRecordedGolden / resultIsDeterministic","description":"골든 파일은 운영비 반영으로 의도적으로 바뀐다. 재생성 후 diff 가 운영비·합계·COST 선택에만 한정되고 일정·재고는 변하지 않아야 한다.","input":"GOLDEN_UPDATE=true 후 일반 실행","expected":"재생성 diff 는 운영비/합계/라벨만, 재실행 시 결정적으로 통과"},{"id":"TC-3","origin":"existing","kind":"regression","target":"ServiceBehaviorTest.staleMasterVersionIsAConflictAndNothingIsSaved / confirmedPlanDoesNotChangeWhenMasterChangesLater / validMasterUpdateIsSavedAndBumpsVersionByOne / initialMasterHasDefaultValues","description":"버전 충돌, 확정 주문 불변, 버전 +1, 초기 기본값 규칙이 운영비 추가 후에도 유지된다(초기 기본값 단언에 운영비 10억 추가).","input":"운영비 포함 마스터 수정 후 확정","expected":"409 충돌, 기존 주문 스냅샷 불변, 버전 +1"},{"id":"TC-4","origin":"existing","kind":"regression","target":"src/test/e2e/master-default-values.spec.ts, master-change-confirm-conflict.spec.ts, master-change-keeps-order.spec.ts, simulation-result-visibility.spec.ts","description":"마스터 화면 기본값, 변경 후 충돌 확정, 기존 주문 유지, 시뮬레이션 결과 표시가 운영비 행 추가 후에도 동작한다.","input":"E2E 시나리오 그대로","expected":"통과(문구가 바뀐 라벨은 의도된 변경으로 갱신)"},{"id":"TC-5","origin":"new","kind":"feature","target":"PlannerTest 운영비 계산","description":"주문 있는 공장만 0일차~총 소요일 매일 부과, 주문 없는 공장은 0원.","input":"중국만 주문, 중국 운영비 10억/일, 총 소요일 N","expected":"운영비 = 10억 × N, 총비용 = 생산원가+운항비+운영비"},{"id":"TC-6","origin":"new","kind":"boundary","target":"PlannerTest 운영비 0","description":"모든 공장 운영비 0이면 결과가 기존과 동일(회귀 보증).","input":"운영비 4곳 모두 0","expected":"운영비 0, COST/FAST/NEAR 가 기존 골든과 같다"},{"id":"TC-7","origin":"new","kind":"feature","target":"PlannerTest COST 선택 기준","description":"운영비가 크면 총비용 최소 안이 더 빠른 안으로 바뀐다. 총비용이 같으면 소요일이 짧은 쪽, FAST 는 기준이 유지된다.","input":"운항비는 더 싸지만 느린 안 vs 비싸지만 빠른 안이 생기는 마스터, 운영비 10억 vs 0","expected":"운영비 10억에서 COST 가 빠른 안 선택, 0이면 운항비 최소 안, FAST/NEAR 선택 기준 불변"},{"id":"TC-8","origin":"new","kind":"boundary","target":"공장별 운영비 차등과 주문 없는 공장","description":"공장마다 값이 달라도 주문 있는 공장 값만 합산한다. 주문 수량 0인 공장 운영비는 아무리 커도 합계에 영향이 없다.","input":"중국 10억, 일본 20억, 주문은 중국만","expected":"일본 운영비는 합계에 포함되지 않음"},{"id":"TC-9","origin":"new","kind":"boundary","target":"MasterService 운영비 입력 검증","description":"음수, 소수, 빈 값, 상한 초과는 이유 메시지와 함께 거부되고 아무것도 저장되지 않는다. 0과 상한값은 허용한다.","input":"operatingCost_CHINA = -1, 1.5, '', 상한+1, 0, 상한","expected":"앞의 네 값은 오류와 미저장, 뒤의 두 값은 저장되고 버전 +1"},{"id":"TC-10","origin":"new","kind":"regression","target":"옛 주문 호환(G1)","description":"운영비 필드가 없는 옛 planJson 과 운영비 컬럼이 비어 있는 주문이 목록·상세에서 운영비 0원으로 정상 표시되고 합계는 그대로다.","input":"운영비 필드 없는 StoredPlan JSON 로드, 컬럼 기본값","expected":"예외 없이 운영비 0원, 합계=생산원가+운항비"},{"id":"TC-11","origin":"new","kind":"feature","target":"src/test/e2e/factory-operating-cost.spec.ts","description":"master 에서 공장별 운영비 기본 10억 확인, 값 변경 저장, 시뮬레이션 화면에 운영비 행과 새 합계가 보이고, 확정 후 상세·목록에 같은 운영비가 보인다.","input":"로그인, /master 수정, /orders/new 시뮬레이션 후 확정","expected":"화면 합계=생산원가+운항비+운영비, 확정 주문 숫자와 일치"},{"id":"TC-12","origin":"new","kind":"regression","target":"src/test/java/com/example/demo/LegacyDbMigrationTest.java (신규)","description":"운영비 컬럼이 없는 이전 스키마의 H2 파일 DB(임시 폴더)를 JDBC 로 직접 만들어 공장·주문 옛 행을 넣고, 같은 파일을 ddl-auto=update 로 Spring 컨텍스트 기동한다. 컬럼 추가 성공, 공장 운영비 null 은 10억으로 읽힘, 옛 주문은 목록 DTO·상세에서 운영비 0원이며 합계 불변, 이후 마스터 저장·시뮬레이션이 동작함을 확인한다.","input":"임시 H2 파일 DB(옛 스키마+옛 행 1건) → SpringApplicationBuilder 로 update 기동 → information_schema 컬럼 조회, OrderService 목록/상세 조회","expected":"기동 예외 없음, factory/orders 에 운영비 컬럼 생김, 옛 주문 운영비 0원·합계 그대로, 마스터 운영비 기본 10억"}],"checklist":[{"title":"운영비 계산과 COST 선택이 결정과 일치한다","detail":"주문 있는 공장만 0일차~총 소요일 매일 부과, 주문 없는 공장 0원, 총비용=생산원가+운항비+운영비, COST 는 총비용 최소(같으면 더 빠른 쪽), FAST/NEAR 기준 불변. 운영비 0이면 기존 골든과 같다."},{"title":"기존 주문과 기존 DB가 깨지지 않는다(G1)","detail":"이전 스키마 H2 파일 DB 로 실제 기동해(LegacyDbMigrationTest) 컬럼 추가가 성공하고, 옛 주문은 운영비 0원으로 목록·상세에 정상 표시되며 합계가 재계산되지 않는다. 마스터 운영비 변경은 버전을 올려 이전 시뮬레이션의 확정을 409 로 막는다."},{"title":"화면·저장·문서가 같은 숫자와 이름을 쓴다","detail":"master 화면의 공장별 4칸(기본 10억, 억 단위 입력, 오류는 이유와 함께), 시뮬레이션·목록·상세의 운영비 행과 합계가 서버 저장값과 같고, PRD F12·§5·§9·§10-3·숫자 예시와 INTENT §5·§7-3 이 '총 비용 최소' 정의로 갱신되었으며 골든 diff 가 의도한 범위뿐이다."}],"plan":"1) 테스트 먼저: PlannerTest 에 TC-5~8, ServiceBehaviorTest/WebBehaviorTest 에 TC-9·10 과 초기 기본값 단언을 추가하고 실패를 확인한다. 2) 모델: Master.FactoryParam 에 operatingCostWon 추가(옛 JSON 은 0 으로 읽히게), Plan 에 operatingCost 추가, Factory 엔티티에 운영비 컬럼(기본 10억, 기존 행 호환), Order 에 operatingCost 컬럼(기본 0). 3) Planner: Candidate 에 운영비(주문 있는 공장 합 × totalDays) 추가, COST 비교를 총비용 최소, 같으면 totalDays 짧은 쪽으로 변경, FAST 보조 기준 정리, 라벨 '총 비용 최소'로 변경. 4) MasterService: operatingCost_\u003c국가> 입력(억 단위, 0 이상 정수 원) 검증과 저장, 버전 +1, DataInitializer 기본 시드 10억. OrderService: 확정 시 서버 재계산 결과의 운영비 저장. Order 상세·목록 DTO 에 운영비·합계 노출. 5) 화면: master.html/master.js 에 공장별 운영비 칸, planview.js/order-new.js/order-detail.js/orders.js·html 에 운영비 행 추가, 옛 주문은 0원 표시. 6) 골든 재생성(GOLDEN_UPDATE=true, 로컬에서만)과 diff 확인, simulate-default.json 갱신. 7) E2E: 신규 factory-operating-cost.spec.ts 작성, 라벨·기본값이 바뀐 기존 spec 문구 갱신(helpers.ts 는 수정하지 않음). 8) 문서: PRD F12·§5-8·§5-10·숫자 예시·§9·§10-3, INTENT §5·§7-3 을 같은 PR 에서 갱신. 9) ./gradlew test 와 관련 E2E 를 실행해 회귀를 확인한다. 10) [재시도 보완] 이전 시도에서 실제 파일 DB 기동 증거가 없었으므로 LegacyDbMigrationTest 를 추가한다: 임시 폴더에 옛 스키마 H2 파일을 JDBC 로 만들고(Hibernate 기본 테이블/컬럼명은 현재 엔티티에서 운영비 컬럼만 뺀 형태, 옛 행 포함) 같은 파일 URL 과 ddl-auto=update 로 컨텍스트를 띄워 컬럼 추가, 옛 주문 0원 표시, 공장 기본 10억을 단언한다. 운영비 컬럼이 nullable 이 아니라 실패하면 엔티티를 고친다. 기존 data/battery 는 건드리지 않고 테스트 결과를 report 에 남긴다.","e2eSpecs":["master-default-values.spec.ts","master-change-confirm-conflict.spec.ts","factory-operating-cost.spec.ts"]}</script>
<script>
(function () {
  var D;
  try { D = JSON.parse(document.getElementById('data').textContent); }
  catch (e) { document.body.insertAdjacentHTML('afterbegin', '<p style="padding:24px">점검 데이터를 읽지 못했습니다.</p>'); return; }
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function pill(text, kind) { return el('span', 'pill ' + kind, text); }

  var hilp = D.status === 'HILP';
  $('hero').classList.toggle('hilp', hilp);
  $('badge').textContent = hilp ? '⏸ HILP — 사람의 판단이 필요합니다' : '✔ READY — 구현을 진행할 수 있습니다';
  $('title').textContent = D.request || '구현 사전 점검';
  $('sub').textContent = (D.round ? D.round + '회차 · ' : '') + (hilp ? (D.reason || '') : '배경·목적·위험·테스트를 점검했습니다');
  document.title = (hilp ? '[HILP] ' : '[READY] ') + '구현 사전 점검';

  var tcs = D.testCases || [];
  var tiles = [
    ['점검 결과', hilp ? 'HILP' : 'READY'],
    ['테스트 케이스', tcs.length],
    ['신규 작성', tcs.filter(function (t) { return t.origin === 'new'; }).length],
    ['위험도', ({ low: '낮음', medium: '보통', high: '높음' })[(D.risk || {}).severity] || '-']
  ];
  tiles.forEach(function (t) { var d = el('div', 'tile'); d.appendChild(el('b', '', String(t[1]))); d.appendChild(el('span', '', t[0])); $('tiles').appendChild(d); });

  if (hilp) {
    var box = el('section', 'card'); box.style.borderColor = 'var(--bad)';
    box.appendChild(el('h2', '', '🙋 사람이 답해야 할 질문'));
    if (D.risk && D.risk.warning && !D.risk.userAware) box.appendChild(el('div', 'alert', '경고: ' + D.risk.warning));
    var ol = el('ol', 'q'); (D.questions || []).forEach(function (q) { ol.appendChild(el('li', '', q)); });
    box.appendChild(ol); $('hilpBox').appendChild(box);
  }

  function understanding(root, u) {
    u = u || {};
    root.appendChild(pill(u.understood ? '이해함' : '이해하지 못함', u.understood ? 'ok' : 'bad'));
    root.appendChild(el('p', '', u.summary || '(내용 없음)'));
    if ((u.evidence || []).length) { var ul = el('ul', 'ev'); u.evidence.forEach(function (x) { ul.appendChild(el('li', '', x)); }); root.appendChild(ul); }
  }
  understanding($('bg'), D.background); understanding($('pu'), D.purpose);

  var R = D.risk || {}, lv = { low: 1, medium: 2, high: 3 }[R.severity] || 0;
  var sz = ({ small: '작음', medium: '보통', large: '큼' })[R.size] || '-';
  var rr = $('risk');
  rr.appendChild(pill('변경 규모: ' + sz, 'info')); rr.appendChild(document.createTextNode(' '));
  rr.appendChild(pill('위험도: ' + (({ low: '낮음', medium: '보통', high: '높음' })[R.severity] || '-'), R.severity === 'high' ? 'bad' : R.severity === 'medium' ? 'warn' : 'ok'));
  rr.appendChild(document.createTextNode(' ')); rr.appendChild(pill(R.userAware ? '사용자가 인지함' : '사용자 인지 여부 불명', R.userAware ? 'ok' : 'warn'));
  var m = el('div', 'meter'); for (var i = 1; i <= 3; i++) m.appendChild(el('i', i <= lv ? 'on ' + R.severity : '')); rr.appendChild(m);
  if (R.warning) rr.appendChild(el('div', 'alert warn', R.warning));
  (R.items || []).forEach(function (x) { var b = el('div', 'risk ' + (x.severity || '')); b.appendChild(el('b', '', x.title || '')); if (x.detail) b.appendChild(el('div', 'small muted', x.detail)); rr.appendChild(b); });
  if (!R.warning && !(R.items || []).length) rr.appendChild(el('p', 'muted', '특별한 위험 요소를 찾지 못했습니다.'));

  var filter = 'all', q = '';
  var defs = [['all', '전체'], ['existing', '기존'], ['new', '신규'], ['regression', '회귀'], ['boundary', '경계값']];
  function match(t) {
    if (filter === 'existing' || filter === 'new') { if (t.origin !== filter) return false; }
    else if (filter !== 'all' && t.kind !== filter) return false;
    var s = (t.id + ' ' + t.target + ' ' + t.description + ' ' + t.input + ' ' + t.expected).toLowerCase();
    return !q || s.indexOf(q) >= 0;
  }
  function drawTcs() {
    var root = $('tcs'); root.textContent = '';
    var list = tcs.filter(match);
    if (!list.length) { root.appendChild(el('div', 'empty', '조건에 맞는 테스트 케이스가 없습니다.')); return; }
    list.forEach(function (t) {
      var c = el('div', 'tc'), h = el('header');
      h.appendChild(pill(t.origin === 'new' ? '신규' : '기존', t.origin === 'new' ? 'acc' : 'info'));
      h.appendChild(pill(({ regression: '회귀', boundary: '경계값', feature: '기능' })[t.kind] || t.kind || '', t.kind === 'boundary' ? 'warn' : t.kind === 'regression' ? 'ok' : 'info'));
      h.appendChild(el('code', '', t.id || '')); c.appendChild(h);
      c.appendChild(el('b', '', t.description || ''));
      var dl = el('dl');
      [['대상', t.target], ['입력', t.input], ['기대', t.expected]].forEach(function (p) { if (p[1]) { dl.appendChild(el('dt', '', p[0])); dl.appendChild(el('dd', '', p[1])); } });
      c.appendChild(dl); root.appendChild(c);
    });
  }
  defs.forEach(function (d) {
    var b = el('button', 'chip', d[1]); b.type = 'button'; b.setAttribute('aria-pressed', String(d[0] === filter));
    b.onclick = function () { filter = d[0]; $('chips').querySelectorAll('button').forEach(function (x, i) { x.setAttribute('aria-pressed', String(defs[i][0] === filter)); }); drawTcs(); };
    $('chips').appendChild(b);
  });
  var s = el('input'); s.type = 'search'; s.placeholder = '테스트 케이스 검색'; s.oninput = function () { q = s.value.toLowerCase(); drawTcs(); }; $('chips').appendChild(s);
  drawTcs();

  var key = 'precheck:' + (D.request || '') + ':' + (D.round || 0), saved = {};
  try { saved = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
  var cl = D.checklist || [];
  function progress() {
    var n = cl.filter(function (_, i) { return saved[i]; }).length;
    $('bar').style.width = (cl.length ? n / cl.length * 100 : 0) + '%';
    $('barTxt').textContent = n + ' / ' + cl.length + ' 확인함';
  }
  cl.forEach(function (c, i) {
    var lab = el('label', 'check' + (saved[i] ? ' done' : '')), cb = el('input'); cb.type = 'checkbox'; cb.checked = !!saved[i];
    var box = el('div'); box.appendChild(el('b', '', (i + 1) + '. ' + (c.title || ''))); if (c.detail) box.appendChild(el('span', 'small muted', c.detail));
    cb.onchange = function () { saved[i] = cb.checked; lab.classList.toggle('done', cb.checked); try { localStorage.setItem(key, JSON.stringify(saved)); } catch (e) {} progress(); };
    lab.appendChild(cb); lab.appendChild(box); $('checks').appendChild(lab);
  });
  progress();

  if (D.plan) $('plan').textContent = D.plan; else $('planCard').hidden = true;
})();
</script>
</body>
</html>
